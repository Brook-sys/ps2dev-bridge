[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ps2dev-bridge"
version = "0.1.0"
description = "MCP + REST debug bridge for PlayStation 2 homebrew development, built on the official ps2dev container"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.3,<4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
